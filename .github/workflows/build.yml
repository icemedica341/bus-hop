# build.yml — CI for BusHop
#
#   - Static analysis (detekt + spotlessCheck + Android lint)
#   - Unit tests (with stacktrace)
#   - Debug APK build
#   - Badge generation (main only)

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: build-test-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Verify CHANGELOG.md has content (PRs)
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -s CHANGELOG.md ]; then
            echo "❌ CHANGELOG.md is empty or missing" && exit 1
          fi
          if git diff --name-only origin/main...HEAD | grep -q CHANGELOG.md; then
            echo "✅ CHANGELOG.md was updated"
          else
            echo "⚠️  CHANGELOG.md was not modified — consider adding release notes"
          fi
      - name: Run checks, tests, and build
        run: |
          TASKS="detekt spotlessCheck test assembleDebug"
          # Skip lint for Dependabot PRs (90s+ for zero value on version bumps)
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ github.event.pull_request.user.login }}" != "dependabot[bot]" ]; then
            TASKS="$TASKS lint"
          fi
          ./gradlew $TASKS --stacktrace

      - name: Update static badges from shields.io (main only)
        if: github.ref_name == 'main'
        run: ./gradlew updateBadges -PautoDetect

      - name: Commit updated badge SVGs
        if: github.ref_name == 'main'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: auto-update test count badge [skip ci]"
          file_pattern: docs/badges/*.svg

  gitleaks:
    name: secret-scan
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

